<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas</title>
    <link rel="stylesheet" href="consultas.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar">
            <h2>Clínica+</h2>

            <nav>
                <ul>
                    <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                    <li><a href="../pacientes/pacientes.html">Pacientes</a></li>
                    <li><a href="../medicos/medicos.html">Médicos</a></li>
                    <li class="active"><a href="../consultas/consultas.html">Consultas</a></li>
                    <li><a href="../prontuarios/prontuarios.html">Prontuários</a></li>
                    <li><a href="../relatorios/relatorios.html">Relatórios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="container">

            <div class="header">

                <h1>Consultas</h1>

                <div class="actions">

                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Pesquisar consulta..."
                    >

                    <button id="btnNovo">
                        Nova Consulta
                    </button>

                </div>

            </div>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Paciente</th>
                            <th>Médico</th>
                            <th>Data</th>
                            <th>Horário</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaConsultas"></tbody>

                </table>

            </div>

        </main>

    </div>

    <div class="modal hidden" id="modal">

        <div class="modal-content">

            <h2>Nova Consulta</h2>

            <form id="consultaForm">

                <input type="hidden" id="editIndex">

                <label for="paciente">Paciente</label>
                <select id="paciente" required>
                </select>

                <label for="medico">Médico</label>
                <select id="medico" required>
                </select>

                <label for="data">Data</label>
                <input
                    type="date"
                    id="data"
                    required
                >

                <label for="horario">Horário</label>
                <input
                    type="time"
                    id="horario"
                    required
                >

                <label for="status">Status</label>
                <select id="status">

                    <option value="Agendada">
                        Agendada
                    </option>

                    <option value="Confirmada">
                        Confirmada
                    </option>

                    <option value="Em Atendimento">
                        Em Atendimento
                    </option>

                    <option value="Concluída">
                        Concluída
                    </option>

                    <option value="Cancelada">
                        Cancelada
                    </option>

                </select>

                <label for="observacoes">Observações</label>

                <textarea
                    id="observacoes"
                    placeholder="Observações da consulta..."
                ></textarea>

                <div class="buttons">

                    <button type="submit">
                        Salvar
                    </button>

                    <button
                        type="button"
                        class="cancel"
                        id="btnCancelar"
                    >
                        Cancelar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="consultas.js"></script>

</body>

</html>
