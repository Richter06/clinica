<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuários</title>
    <link rel="icon" href="../icons/vitaIcon.png" type="image/png">
    <link rel="stylesheet" href="prontuarios.css">
</head>

<body>

    <div class="layout">

        <aside class="sidebar" id="sidebar">
            <h2>Clínica Vita+</h2>

            <nav>
                <ul>
                    <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                    <li><a href="../pacientes/pacientes.html">Pacientes</a></li>
                    <li><a href="../medicos/medicos.html">Médicos</a></li>
                    <li><a href="../consultas/consultas.html">Consultas</a></li>
                    <li class="active"><a href="../prontuarios/prontuarios.html">Prontuários</a></li>
                    <li><a href="../relatorios/relatorios.html">Relatórios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">

            <div class="top-bar">
                <button id="themeToggle" type="button">
                    <img id="themeIcon" src="../icons/light.png" alt="Toggle Theme">
                </button>

                <button id="menuToggle" class="menu-toggle" type="button">☰</button>
            </div>

            <h1>Prontuários</h1>

            <div class="top">

                <select id="filtroPaciente">
                    <option value="">Todos os pacientes</option>
                </select>

                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Buscar por paciente, médico ou diagnóstico...">

                <button id="btnNovo" type="button">Novo registro</button>
            </div>

            <div class="historico">
                <h2>Histórico do paciente</h2>
                <div id="lista"></div>
            </div>

        </main>

    </div>

    <!-- MODAL -->
    <div class="modal hidden" id="modal">
        <div class="modal-box">
            <h2>Novo Prontuário</h2>

            <form id="form">

                <input type="hidden" id="editIndex">

                <label for="pacienteSelect">Paciente</label>
                <select id="pacienteSelect" required>
                    <option value="">Selecione um paciente</option>
                </select>

                <label for="medico">Médico</label>
                <select id="medico" required>
                    <option value="">Selecione um médico</option>
                </select>

                <label for="queixa">Queixa principal</label>
                <input type="text" id="queixa" maxlength="200" placeholder="Ex.: dor de cabeça, febre...">

                <label for="diagnostico">Diagnóstico</label>
                <input type="text" id="diagnostico" required maxlength="200" placeholder="Informe o diagnóstico">

                <label for="alergias">Alergias</label>
                <input type="text" id="alergias" maxlength="200" placeholder="Ex.: dipirona, poeira...">

                <label for="medicacoes">Medicações em uso</label>
                <input type="text" id="medicacoes" maxlength="200" placeholder="Medicamentos em uso">

                <label for="examesSolicitados">Exames solicitados</label>
                <input type="text" id="examesSolicitados" maxlength="200" placeholder="Exames solicitados">

                <label for="procedimentos">Procedimentos realizados</label>
                <input type="text" id="procedimentos" maxlength="200" placeholder="Procedimentos realizados">

                <label for="evolucao">Evolução</label>
                <textarea id="evolucao" maxlength="500" placeholder="Evolução do paciente"></textarea>

                <label for="pressao">Pressão arterial</label>
                <input type="text" id="pressao" maxlength="20" placeholder="Ex.: 120/80">

                <label for="temperatura">Temperatura</label>
                <input type="text" id="temperatura" maxlength="10" placeholder="Ex.: 36.7°C">

                <label for="frequenciaCardiaca">Frequência cardíaca</label>
                <input type="text" id="frequenciaCardiaca" maxlength="20" placeholder="Ex.: 80 bpm">

                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" step="0.01" min="0" placeholder="Ex.: 70.5">

                <label for="altura">Altura (m)</label>
                <input type="number" id="altura" step="0.01" min="0" placeholder="Ex.: 1.75">

                <label for="imc">IMC</label>
                <input type="text" id="imc" readonly placeholder="Calculado automaticamente">

                <label for="observacoes">Observações</label>
                <textarea id="observacoes" maxlength="1000" placeholder="Observações do atendimento"></textarea>

                <div class="buttons">
                    <button type="submit">Salvar</button>
                    <button type="button" id="cancelar">Cancelar</button>
                </div>

            </form>
        </div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="prontuarios.js"></script>

</body>

</html>
