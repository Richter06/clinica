<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos</title>
    <link rel="stylesheet" href="medicos.css">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <h2>Clínica Vita+</h2>

        <nav>
            <ul>
                <li><a href="../dashboard/dashboard.html">Dashboard</a></li>
                <li><a href="../pacientes/pacientes.html">Pacientes</a></li>
                <li class="active"><a href="../medicos/medicos.html">Médicos</a></li>
                <li><a href="../consultas/consultas.html">Consultas</a></li>
                <li><a href="../prontuarios/prontuarios.html">Prontuários</a></li>
                <li><a href="../relatorios/relatorios.html">Relatórios</a></li>
            </ul>
        </nav>
    </aside>

    <main class="container">

        <div class="header">
            <h1>Médicos</h1>

            <div class="actions">
                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Pesquisar médico..."
                >

                <button id="btnNovo">
                    Novo Médico
                </button>
            </div>
        </div>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CRM</th>
                        <th>Especialidade</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="listaMedicos"></tbody>

            </table>

        </div>

    </main>

</div>

<div class="modal hidden" id="modal">

    <div class="modal-content">

        <h2>Médico</h2>

        <form id="medicoForm">

            <input type="hidden" id="editIndex">

            <label>Nome</label>
            <input type="text" id="nome" required>

            <label>CRM</label>
            <input type="text" id="crm" required>

            <label>Especialidade</label>
            <input type="text" id="especialidade" required>

            <label>Telefone</label>
            <input type="text" id="telefone" required>

            <label>E-mail</label>
            <input type="email" id="email" required>

            <div class="buttons">
                <button type="submit">Salvar</button>

                <button
                    type="button"
                    class="cancel"
                    id="btnCancelar">
                    Cancelar
                </button>
            </div>

        </form>

    </div>

</div>

<script src="medicos.js"></script>

</body>
</html>
